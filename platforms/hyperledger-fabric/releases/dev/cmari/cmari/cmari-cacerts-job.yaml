apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cmari-cacerts-job
  namespace: cmari-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: cmari-cacerts-job
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-mar
        namespace: flux-mar
      chart: platforms/hyperledger-fabric/charts/fabric-cacerts-gen
  values:
    metadata:
      name: cmari
      component_name: cmari-net
      namespace: cmari-net    
      images:
       alpineutils: ghcr.io/hyperledger/bevel-alpine:latest
    vault:
      role: vault-role
      address: http://98.64.226.131:20001
      authpath: marcmari
      secretcryptoprefix: secretsv2/data/cmari/peerOrganizations/cmari-net/ca
      secretcredentialsprefix: secretsv2/data/cmari/credentials/cmari-net/ca/cmari
      serviceaccountname: vault-auth
      type: hashicorp
      imagesecretname: ""
      
    ca:
      subject: /C=GB/ST=London/L=London/O=Carrier/CN=ca.cmari-net
