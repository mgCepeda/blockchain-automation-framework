apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: anchorpeer-allchannel-cmari
  namespace: cmari-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: anchorpeer-allchannel-cmari
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-mar
        namespace: flux-mar
      chart: platforms/hyperledger-fabric/charts/fabric-anchorpeer
  values:
    metadata:
      namespace: cmari-net
      network:
        version: 2.5.4
      images:
        fabrictools: ghcr.io/hyperledger/bevel-fabric-tools:2.5.4
        alpineutils: ghcr.io/hyperledger/bevel-alpine:latest

    peer:
      name: peer0
      address: peer0.cmari-net.hlf.blockchaincloudpoc-develop.com:443
      localmspid: cmariMSP
      loglevel: debug
      tlsstatus: true

    vault:
      role: vault-role
      address: http://98.64.226.131:20001
      authpath: marcmari
      adminsecretprefix: secretsv2/data/cmari/peerOrganizations/cmari-net/users/admin
      orderersecretprefix: secretsv2/data/cmari/peerOrganizations/cmari-net/orderer
      serviceaccountname: vault-auth
      type: hashicorp
      imagesecretname: ""
      

    channel:
      name: allchannel      
    orderer:
      address: orderer1.hlf.blockchaincloudpoc-develop.com:443
    anchorstx: |-
      

