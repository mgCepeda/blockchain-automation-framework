apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: joinchannel-peer0-join-allchannel-wmari-peer0
  namespace: wmari-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: joinchannel-peer0-join-allchannel-wmari-peer0
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-mar
        namespace: flux-mar
      chart: platforms/hyperledger-fabric/charts/fabric-channel-join
  values:
    metadata:
      namespace: wmari-net
      images:
        fabrictools: ghcr.io/hyperledger/bevel-fabric-tools:2.5.4
        alpineutils: ghcr.io/hyperledger/bevel-alpine:latest

    peer:
      name: peer0
      address: peer0.wmari-net.hlf.blockchaincloudpoc-develop.com:443
      localmspid: wmariMSP
      loglevel: debug
      tlsstatus: true

    vault:
      role: vault-role
      address: http://98.64.226.131:20001
      authpath: marwmari
      adminsecretprefix: secretsv2/data/wmari/peerOrganizations/wmari-net/users/admin
      orderersecretprefix: secretsv2/data/wmari/peerOrganizations/wmari-net/orderer
      serviceaccountname: vault-auth
      type: hashicorp
      imagesecretname: ""

    channel:
      name: allchannel      
    orderer:
      address: orderer1.hlf.blockchaincloudpoc-develop.com:443
