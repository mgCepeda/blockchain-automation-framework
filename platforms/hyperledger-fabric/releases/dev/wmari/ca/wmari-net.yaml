apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: wmari-net-ca
  namespace: wmari-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: wmari-net-ca
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-mar
        namespace: flux-mar
      chart: platforms/hyperledger-fabric/charts/fabric-ca-server  
  values:
    metadata:
      namespace: wmari-net
      images:
        alpineutils: ghcr.io/hyperledger/bevel-alpine:latest
        ca: ghcr.io/hyperledger/bevel-fabric-ca:latest
 
    server:
      name: ca
      tlsstatus: true
      admin: wmari-admin 
  
    storage:
      storageclassname: wmari-bevel-storageclass
      storagesize: 512Mi
    vault:
      role: vault-role
      address: http://98.64.226.131:20001
      authpath: marwmari
      secretcert: secretsv2/data/wmari/peerOrganizations/wmari-net/ca?ca.wmari-net-cert.pem
      secretkey: secretsv2/data/wmari/peerOrganizations/wmari-net/ca?wmari-net-CA.key
      secretadminpass: secretsv2/data/wmari/credentials/wmari-net/ca/wmari?user
      serviceaccountname: vault-auth
      type: hashicorp
      imagesecretname: ""
    service:
      servicetype: ClusterIP
      ports:
        tcp:
          clusteripport: 7054
    proxy:
      provider: haproxy
      type: peer
      external_url_suffix: hlf.blockchaincloudpoc-develop.com
