apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: smari-orderer1
  namespace: smari-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: smari-orderer1
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-mar
        namespace: flux-mar
      chart: platforms/hyperledger-fabric/charts/fabric-orderernode
  values:
    metadata:
      namespace: smari-net
      network:
        version: 2.5.4
      images:
        orderer: ghcr.io/hyperledger/bevel-fabric-orderer:2.5.4
        alpineutils: ghcr.io/hyperledger/bevel-alpine:latest
    orderer:
      name: orderer1
      loglevel: info
      localmspid: smariMSP
      tlsstatus: true
      keepaliveserverinterval: 10s
      ordererAddress: orderer1.hlf.blockchaincloudpoc-develop.com:443

    consensus:
      name: raft

    storage:
      storageclassname: smari-bevel-storageclass
      storagesize: 512Mi  

    service:
      servicetype: ClusterIP
      ports:
        grpc:
          clusteripport: 7050
        metrics: 
          enabled: False
          clusteripport: 9443

    vault:
      address: http://98.64.226.131:20001
      role: vault-role
      authpath: marsmari
      type: hashicorp
      secretprefix: secretsv2/data/smari/ordererOrganizations/smari-net/orderers/orderer1.smari-net
      imagesecretname: ""
      serviceaccountname: vault-auth

    proxy:
      provider: haproxy
      external_url_suffix: hlf.blockchaincloudpoc-develop.com

    config:
      pod:
        resources:
          limits:
            memory: 512M
            cpu: 1
          requests:
            memory: 512M
            cpu: 0.25
